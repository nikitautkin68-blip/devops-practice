services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
