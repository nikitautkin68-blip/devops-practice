version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - '8080:80'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

  app:
    image: node:alpine
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      - NODE_ENV=production
    ports:
      - '3000:3000'
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge